<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/><title>Execution Trace</title>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/14.7.0/nouislider.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/wnumb/1.2.0/wNumb.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/14.7.0/nouislider.min.css"/>

<style>
body {
    font-family: Arial, sans-serif;
}

table, td, th {
    border: 1px solid black;
}

th, .textCell {
    padding: 1px 5px;
}

td {
    text-align: center;
}

code {
    white-space: nowrap;

}

.cycleHeader span {
    vertical-align: middle;
    font-weight: normal;
    font-size: 12px;
    display: inline-block;
    min-width: 1em;
    text-align: center;
    white-space: nowrap;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
}

.cycleHeader {
    min-width: 12.5px;
    position: relative;
    padding: 1px;
}
.cycleHeader::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: -10000000px;
    background-color: #f2f2f2;
    z-index: -1;
}
.cycleHeader:nth-child(even)::before {
    background-color: white;
}

.blocked-cell {
    border: 2px dotted #ff6b6b !important;
    cursor: help;
    position: relative;
}

.blocked-cell[data-tooltip]:hover::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background-color: #333;
    color: #fff;
    padding: 8px 12px;
    border-radius: 4px;
    white-space: pre-line;
    font-size: 13px;
    z-index: 1000;
    min-width: 200px;
    text-align: left;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    margin-bottom: 5px;
}

.blocked-cell[data-tooltip]:hover::before {
    content: '';
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: #333;
    z-index: 1000;
    margin-bottom: -1px;
}

.move-eliminated-cell {
    border: 2px solid #4CAF50 !important;
    cursor: help;
    position: relative;
}

.move-eliminated-cell[data-tooltip]:hover::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background-color: #2d5f2f;
    color: #fff;
    padding: 8px 12px;
    border-radius: 4px;
    white-space: pre-line;
    font-size: 13px;
    z-index: 1000;
    min-width: 200px;
    text-align: left;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    margin-bottom: 5px;
}

.move-eliminated-cell[data-tooltip]:hover::before {
    content: '';
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: #2d5f2f;
    z-index: 1000;
    margin-bottom: -1px;
}

.move-not-eliminated-cell {
    border: 2px dashed #FF9800 !important;
    cursor: help;
    position: relative;
}

.move-not-eliminated-cell[data-tooltip]:hover::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background-color: #8B5A00;
    color: #fff;
    padding: 8px 12px;
    border-radius: 4px;
    white-space: pre-line;
    font-size: 13px;
    z-index: 1000;
    min-width: 200px;
    text-align: left;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    margin-bottom: 5px;
}

.move-not-eliminated-cell[data-tooltip]:hover::before {
    content: '';
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: #8B5A00;
    z-index: 1000;
    margin-bottom: -1px;
}
</style>

<script>
var tableData = {}

var eventToColor = {
    "P": "Cyan",
    "Q": "LightSkyBlue",
    "I": "Pink",
    "r": "OrangeRed",
    "D": "Orange",
    "E": "Yellow",
    "R": "ForestGreen",
}

var eventNames = {
    "P": "Predecoded",
    "Q": "Added to IDQ",
    "I": "Issued",
    "r": "Ready for dispatch",
    "D": "Dispatched",
    "E": "Executed",
    "R": "Retired"
}

function formatBlockingReason(reason, stallType) {
    var reasonMap = {
        'ms_post_stall': 'MS post-stall cleanup',
        'ms_stalled': stallType === 'pre_stall' ? 'MS pre-stall (initializing)' : 'MS delivering (stalled)',
        'port_busy_older_uop': 'Port busy with older uop',
        'port_blocked_resource': 'Port blocked by resource',
        'port_removed_by_constraint': 'Port removed by constraint',
        'register_merge_required': 'Waiting for register merge',
        'serializing_instruction_waiting': 'Serializing instruction waiting',
        'issue_width_exceeded': 'Issue width limit reached',
        'reorder_buffer_full': 'Reorder buffer full',
        'reservation_station_full': 'Reservation station full',
        'idq_full': 'IDQ full',
        'eliminated': 'Move eliminated via register aliasing',
        'aliasing_slots_exhausted': 'Register aliasing tracking slots full',
        'pipeline_busy_prev_eliminations': 'Move elimination pipeline busy',
        'cycle_slot_limit_reached': 'Cycle elimination limit reached',
        'multiple_constraints': 'Multiple elimination constraints exceeded'
    }
    return reasonMap[reason] || reason.replace(/_/g, ' ')
}

function formatTooltip(blocking) {
    var lines = []
    lines.push('Blocked at ' + blocking.stage)
    lines.push('Reason: ' + formatBlockingReason(blocking.reason, blocking.stallType))
    lines.push('Waiting for: ' + eventNames[blocking.waitingFor])
    return lines.join('\n')
}

function formatMoveEliminationTooltip(moveElim) {
    var lines = []
    if (moveElim.eliminated) {
        lines.push('Move eliminated via register aliasing')
        lines.push(moveElim.regType + ' register renamed without allocation')
    } else {
        lines.push('Move elimination failed')
        lines.push('Reason: ' + formatBlockingReason(moveElim.reason))
        lines.push('Slots: ' + moveElim.used + '/' + moveElim.totalSlots + ' used')
        if (moveElim.pipeline > 0) {
            lines.push('Pipeline penalty: ' + moveElim.pipeline)
        }
        if (moveElim.aliasing > 0) {
            lines.push('Aliasing slots: ' + moveElim.aliasing)
        }
        lines.push('Available: ' + moveElim.available)
    }
    return lines.join('\n')
}

function createTable() {
    var slider = document.getElementById('slider')
    var firstIt = Number(slider.noUiSlider.get()[0])
    var lastIt = Number(slider.noUiSlider.get()[1])

    var minCycle = Number.MAX_VALUE
    var maxCycle = 0

    for (let i = firstIt; i <= lastIt; i++) {
        for (let instr of tableData[i]) {
            for (let uop of instr.uops) {
                for (let c in uop.events) {
                    minCycle = Math.min(minCycle, Number(c))
                    maxCycle = Math.max(maxCycle, Number(c))
                }
            }
        }
    }

    tableHtml = '<tr>'
    tableHtml += '<th rowspan="2" style="vertical-align: bottom">It.</th>'
    tableHtml += '<th rowspan="2" style="vertical-align: bottom; text-align:left">Instruction</th>'
    tableHtml += '<th colspan="2">&mu;ops</th>'
    tableHtml += `<th colspan="${maxCycle+1}" style="text-align:left">Cycle</th>`
    tableHtml += '</tr>'
    tableHtml += '<tr>'
    tableHtml += '<th>Possible Ports</th>'
    tableHtml += '<th>Actual Port</th>'
    for (let i = minCycle; i <= maxCycle; i++) {
        tableHtml += `<th class="cycleHeader"><span>${i}</span></th>`
    }
    tableHtml += '</tr>'

    for (let i = firstIt; i <= lastIt; i++) {
        var nLinesIt = 0
        for (let instr of tableData[i]) {
            nLinesIt += instr.uops.length
        }
        tableHtml += '<tr style="border-top: 2px solid black">'
        tableHtml += `<td rowspan="${nLinesIt}" class="textCell">${i}</td>`
        for (let [instrI, instr] of tableData[i].entries()) {
            if (instrI > 0) tableHtml += '<tr>'
            tableHtml += `<td rowspan="${instr.uops.length}" class="textCell" style="text-align: left"><code>${instr.str}</code></td>`

            for (let [uopI, uop] of instr.uops.entries()) {
                if (uopI > 0) tableHtml += '<tr>'
                tableHtml += `<td class="textCell">${uop.possiblePorts}</td>`
                tableHtml += `<td class="textCell">${uop.actualPort}</td>`

                if (Object.keys(uop.events).length == 0) {
                    tableHtml += '<td colspan="' + (maxCycle - minCycle + 1) + '"></td></tr>'
                } else {
                    minUopCycle = Math.min(...Object.keys(uop.events));
                    maxUopCycle = Math.max(...Object.keys(uop.events));

                    if (minUopCycle - minCycle > 0)
                        tableHtml += '<td colspan="' + (minUopCycle - minCycle) + '"></td>'

                    events = Object.entries(uop.events)
                    for (let j = 0; j < events.length; j++) {
                        var cycle = events[j][0]
                        var event = events[j][1]
                        var cellClass = ''
                        var tooltip = ''

                        // Check for blocking information at this cycle
                        if (uop.blocking && uop.blocking[cycle]) {
                            cellClass = ' class="blocked-cell"'
                            tooltip = ' data-tooltip="' + formatTooltip(uop.blocking[cycle]) + '"'
                        }

                        // Check for move elimination information
                        if (uop.moveElimination) {
                            // For successful elimination, annotate the 'E' event
                            if (uop.moveElimination.eliminated && event === 'E') {
                                cellClass = ' class="move-eliminated-cell"'
                                tooltip = ' data-tooltip="' + formatMoveEliminationTooltip(uop.moveElimination) + '"'
                            }
                            // For failed elimination, annotate the 'I' event
                            else if (!uop.moveElimination.eliminated && event === 'I') {
                                cellClass = ' class="move-not-eliminated-cell"'
                                tooltip = ' data-tooltip="' + formatMoveEliminationTooltip(uop.moveElimination) + '"'
                            }
                        }

                        tableHtml += '<td' + cellClass + tooltip + ' style="background-color:' + eventToColor[event] + '">' + event + '</td>'

                        // Handle gap between this event and next
                        if ((j < events.length - 1) && (Number(events[j+1][0]) > Number(events[j][0]) + 1)) {
                            var gapStart = Number(events[j][0]) + 1
                            var gapEnd = Number(events[j+1][0]) - 1

                            // Check if any cycles in the gap have blocking info
                            var hasBlocking = false
                            if (uop.blocking) {
                                for (let c = gapStart; c <= gapEnd; c++) {
                                    if (uop.blocking[c]) {
                                        hasBlocking = true
                                        break
                                    }
                                }
                            }

                            if (hasBlocking) {
                                // Render cells with colspan for non-blocking, individual cells for blocking
                                let c = gapStart;
                                while (c <= gapEnd) {
                                    if (uop.blocking && uop.blocking[c]) {
                                        // This cycle has blocking, create individual cell
                                        var gapCellClass = ' class="blocked-cell"'
                                        var gapTooltip = ' data-tooltip="' + formatTooltip(uop.blocking[c]) + '"'
                                        bg = `background-image: linear-gradient(to right, ${eventToColor[events[j][1]]} , ${eventToColor[events[j+1][1]]})`
                                        tableHtml += '<td' + gapCellClass + gapTooltip + ' style="' + bg + '"></td>'
                                        c++;
                                    } else {
                                        // Find how many consecutive non-blocking cycles
                                        let nonBlockingStart = c;
                                        while (c <= gapEnd && (!uop.blocking || !uop.blocking[c])) {
                                            c++;
                                        }
                                        let nonBlockingCount = c - nonBlockingStart;
                                        bg = `background-image: linear-gradient(to right, ${eventToColor[events[j][1]]} , ${eventToColor[events[j+1][1]]})`
                                        tableHtml += '<td style="' + bg + '" colspan="' + nonBlockingCount + '"></td>'
                                    }
                                }
                            } else {
                                // No blocking, use single colspan cell as before
                                bg = `background-image: linear-gradient(to right, ${eventToColor[events[j][1]]} , ${eventToColor[events[j+1][1]]})`
                                tableHtml += '<td style="' + bg + '" colspan="' + (gapEnd - gapStart + 1) + '"></td>'
                            }
                        }
                    }
                    if (maxUopCycle - minCycle < maxCycle - minCycle) {
                        tableHtml += '<td colspan="' + ((maxCycle - minCycle) - (maxUopCycle - minCycle)) + '"></td>'
                    }
                    tableHtml += '</tr>'
                }
            }
        }
    }

    $("#traceTable").html(tableHtml)
}

function createLegend() {
    legendHtml = ''
    for (let [ev, expl] of [['P', 'Predecoded'], ['Q', 'Added to IDQ'], ['I', 'Issued'], ['r', 'Ready for dispatch'],
                              ['D', 'Dispatched'], ['E', 'Executed'], ['R', 'Retired']]) {
        legendHtml += `<tr><td style="background-color:${eventToColor[ev]}">${ev}</td>`
        legendHtml += `<td style="padding-left: 10px; text-align:left; border: 0">${expl}</td></tr>`
    }
    $("#legendTable").html(legendHtml)
}

$(document).ready(function() {
    createLegend()

    var slider = document.getElementById('slider')
    var maxIteration = Math.max(1, tableData.length-1)  // Ensure max > min for noUiSlider
    noUiSlider.create(slider, {
        start: [0, Math.min(50, maxIteration)],
        connect: true,
        range: {
            'min': 0,
            'max': maxIteration
        },
        tooltips: true,
        format: wNumb({
            decimals: 0
        }),
    });
    slider.noUiSlider.on('change', function (values, handle) {
        createTable()
    });

    createTable()
});
</script>
</head>
<body>
<h1>Execution Trace</h1>

<table id="legendTable" style="border: 0; border-collapse:separate;"></table>

<p>
    <div style="display: flex">
        <div style="padding-right: 30px">Show iterations from/to:</div>
        <div id="slider" style="max-width: 400px;flex-grow: 1;"></div>
    </div>
</p>

<h3></h3>
<table id="traceTable" style="border-collapse: collapse; overflow:hidden;"></table>
</body>
</html>
