[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uica"
version = "1.0.0"
description = "uiCA: uops.info Code Analyzer - Throughput prediction for Intel CPUs"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Andreas Abel"},
]
maintainers = [
    {name = "Compiler Explorer Team"},
]
keywords = ["cpu", "performance", "throughput", "x86", "disassembler", "uops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Disassemblers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "plotly",
]

[project.optional-dependencies]
windows = ["pydot"]

[project.scripts]
uica = "uiCA:main"
uica-facile = "facile:main"

[project.urls]
Homepage = "https://uica.uops.info"
Repository = "https://github.com/compiler-explorer/uiCA"
"Bug Tracker" = "https://github.com/compiler-explorer/uiCA/issues"

[tool.setuptools]
py-modules = ["uiCA", "facile", "instructions", "microArchConfigs", "utils", "x64_lib", "convertXML"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["instrData*"]

[tool.setuptools.package-data]
"*" = ["*.so", "*.pyd", "*.dylib"]
